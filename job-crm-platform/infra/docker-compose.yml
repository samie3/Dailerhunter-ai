version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-jobcrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-jobcrm}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecret}@redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: crm_worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-jobcrm}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecret}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  aggregator:
    build:
      context: ../services/aggregator
      dockerfile: Dockerfile
    container_name: crm_aggregator
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-jobcrm}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecret}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  communication:
    build:
      context: ../services/communication
      dockerfile: Dockerfile
    container_name: crm_communication
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-jobcrm}
    depends_on:
      postgres:
        condition: service_healthy

  messaging:
    build:
      context: ../services/messaging
      dockerfile: Dockerfile
    container_name: crm_messaging
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecret}@redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-jobcrm}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - whatsapp_sessions:/app/sessions

  ai:
    build:
      context: ../services/ai
      dockerfile: Dockerfile
    container_name: crm_ai
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-jobcrm}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    env_file: ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  whatsapp_sessions:
